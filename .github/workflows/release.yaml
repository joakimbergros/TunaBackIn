name: Release

# Push a tag like v0.2.0.0 → build, test, publish a GitHub Release with the plugin zip,
# and add the version to manifest.json on main (the Jellyfin plugin repository).
on:
  push:
    tags: ["v*.*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the tagged commit
        run: git checkout "$GITHUB_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=tunabackin_$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Jellyfin.Plugin.TunaBackIn.slnx -c Release

      - name: Build
        run: >
          dotnet publish src/Jellyfin.Plugin.TunaBackIn -c Release -o artifacts
          -p:Version=${{ steps.v.outputs.version }}
          -p:AssemblyVersion=${{ steps.v.outputs.version }}
          -p:FileVersion=${{ steps.v.outputs.version }}

      - name: Package
        run: cd artifacts && zip -j "../${{ steps.v.outputs.zip }}" Jellyfin.Plugin.TunaBackIn.dll

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "${{ steps.v.outputs.zip }}"
          --title "TunaBackIn $GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Update manifest.json on main
        run: |
          cp "${{ steps.v.outputs.zip }}" "$RUNNER_TEMP/"
          git checkout main
          python3 scripts/update_manifest.py \
            --version "${{ steps.v.outputs.version }}" \
            --zip "$RUNNER_TEMP/${{ steps.v.outputs.zip }}" \
            --source-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${{ steps.v.outputs.zip }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(release): add ${{ steps.v.outputs.version }} to manifest"
          git push origin main
